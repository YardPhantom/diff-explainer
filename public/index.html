<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diff Explainer</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Diff Explainer</h1><p>Paste a git diff and get a plain-English summary plus risk flags — heuristic, no API key.</p></header>
<main><section><textarea id="in" placeholder="Paste output of git diff..."></textarea><br><button id="go">Explain diff</button><button id="sample" class="alt">Load sample</button></section><section id="out"><div class="card"><em>Results appear here.</em></div></section></main>
<footer>Built by <a href="https://trevorheshka.com">Trevor Heshka</a> · runs 100% in your browser</footer><script src="app.js"></script></body></html>
